
name: Build RetroBrunch



on:

  workflow_dispatch:

  push:

    branches:

      - retrobrunch



concurrency:

  group: retrobrunch-${{ github.ref }}

  cancel-in-progress: true



jobs:

  prepare-kernels:

    name: Prepare Kernels

    runs-on: ubuntu-24.04



    outputs:

      matrix: ${{ steps.kernels.outputs.matrix }}



    steps:

      - name: Install dependencies

        run: |

          sudo apt update

          sudo apt install -y gcc-12 g++-12 git fakeroot build-essential ncurses-dev xz-utils libssl-dev bc flex libelf-dev bison sbsigntool



          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 110 --slave /usr/bin/g++ g++ /usr/bin/g++-12 --slave /usr/bin/gcov gcov /usr/bin/gcov-12



      - name: Checkout RetroBrunch

        uses: actions/checkout@v6



      - name: Prepare kernels

        run: ./prepare_kernels.sh



      - name: Define kernel matrix

        id: kernels

        run: |

          echo "matrix=$(echo [\"$(ls -d ./kernels/* | cut -f3 -d'/' | sed -Ez '$ s/\n+$//' | sed -z 's#\n#\",\"#g')\"])" >> $GITHUB_OUTPUT



      - name: Compress kernel sources

        run: tar zcf /tmp/kernels-source.tar.gz kernels



      - name: Upload kernel sources

        uses: actions/upload-artifact@v7

        with:

          name: kernels-source

          path: /tmp/kernels-source.tar.gz

          if-no-files-found: error





  build-kernels:

    name: Build Kernel ${{ matrix.kernel }}

    needs: prepare-kernels

    runs-on: ubuntu-24.04



    strategy:

      fail-fast: false

      matrix:

        kernel: ${{ fromJson(needs.prepare-kernels.outputs.matrix) }}



    steps:

      - name: Install dependencies

        run: |

          sudo apt update

          sudo apt install -y gcc-12 g++-12 git fakeroot build-essential ncurses-dev xz-utils libssl-dev bc flex libelf-dev bison sbsigntool



          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 110 --slave /usr/bin/g++ g++ /usr/bin/g++-12 --slave /usr/bin/gcov gcov /usr/bin/gcov-12



      - name: Checkout RetroBrunch

        uses: actions/checkout@v6



      - name: Download kernel sources

        uses: actions/download-artifact@v7

        with:

          name: kernels-source

          path: /tmp



      - name: Extract kernel sources

        run: tar -zxf /tmp/kernels-source.tar.gz



      - name: Create temporary signing keys directory

        run: |

          sudo ln -sf "$RUNNER_TEMP" /persist

          mkdir -p /persist/keys



      - name: Build kernel

        run: ./build_kernels.sh ${{ matrix.kernel }}



      - name: Compress built kernel

        run: |

          tar zcf /tmp/built-kernel-${{ matrix.kernel }}.tar.gz \

            kernels/${{ matrix.kernel }}



      - name: Upload built kernel

        uses: actions/upload-artifact@v7

        with:

          name: built-kernel-${{ matrix.kernel }}

          path: /tmp/built-kernel-${{ matrix.kernel }}.tar.gz

          if-no-files-found: error





  build-retrobrunch:

    name: Build RetroBrunch

    needs: build-kernels

    runs-on: ubuntu-24.04



    steps:

      - name: Free disk space

        uses: jlumbroso/free-disk-space@main

        with:

          tool-cache: true



      - name: Install dependencies

        run: |

          sudo apt update

          sudo apt install -y gcc-12 g++-12 git fakeroot build-essential ncurses-dev xz-utils libssl-dev bc flex libelf-dev bison sbsigntool python3-protobuf \

            rdfind zstd pv \

            syslinux syslinux-common mtools dosfstools



          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 110 --slave /usr/bin/g++ g++ /usr/bin/g++-12 --slave /usr/bin/gcov gcov /usr/bin/gcov-12



          pip3 install --upgrade google-api-python-client



      - name: Free additional disk space

        run: |

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

          sudo apt clean

          df -h



      - name: Checkout RetroBrunch

        uses: actions/checkout@v6



      - name: Download built kernels

        uses: actions/download-artifact@v7

        with:

          path: /tmp



      - name: Restore built kernels

        run: |

          for file in /tmp/built-kernel-*/built-kernel-*.tar.gz

          do

            tar zxf "$file"

          done



      - name: Build RetroBrunch

        run: |

          chmod +x scripts/build-bios-image.sh

          sudo bash build_brunch.sh



      - name: Show output

        run: |

          ls -lah out/



      - name: Upload RetroBrunch artifact

        uses: actions/upload-artifact@v7

        with:

          name: retrobrunch-r151

          path: |

            out/brunch_retro_*.tar.gz

            out/brunch_r*.tar.gz

          if-no-files-found: error

