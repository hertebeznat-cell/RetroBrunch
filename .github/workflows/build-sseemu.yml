name: Build Retro SSE emulator

on:
  workflow_dispatch:
  push:
    branches:
      - retrobrunch
    paths:
      - 'retro-sse-emu/**'
      - '.github/workflows/build-sseemu.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: retrobrunch
      - name: Build
        working-directory: retro-sse-emu
        run: |
          make
          make check
          file libretro_sse.so
          sha256sum libretro_sse.so
      - name: Package
        run: |
          mkdir -p out
          cp retro-sse-emu/libretro_sse.so out/
          cp retro-sse-emu/install-sseemu.sh out/
          cp retro-sse-emu/README.md out/
          tar -C out -czf retro-sse-emu-pineview.tar.gz .
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: retro-sse-emu-pineview
          path: retro-sse-emu-pineview.tar.gz
          if-no-files-found: error
