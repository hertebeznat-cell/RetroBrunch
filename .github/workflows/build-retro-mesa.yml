name: Build RetroMesa Pineview

on:
  workflow_dispatch:
  push:
    branches:
      - retrobrunch
    paths:
      - ".github/workflows/build-retro-mesa.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git meson ninja-build pkg-config python3 python3-mako \
            clang lld libc++-dev libc++abi-dev \
            libdrm-dev libexpat1-dev libzstd-dev zlib1g-dev \
            libpciaccess-dev bison flex

      - name: Clone exact ChromeOS Mesa
        run: |
          git clone https://chromium.googlesource.com/chromiumos/third_party/mesa mesa
          cd mesa
          git checkout 7e19431c4486b880d8f9b8681d50222ba44d651e
          git rev-parse HEAD
          git log -1 --oneline

      - name: Configure Pineview Mesa with softpipe fallback
        working-directory: mesa
        env:
          CC: clang
          CXX: clang++
          CFLAGS: >-
            -O2 -march=x86-64 -mtune=generic
            -mno-sse4.1 -mno-sse4.2 -mno-avx -mno-avx2
          CXXFLAGS: >-
            -O2 -march=x86-64 -mtune=generic
            -mno-sse4.1 -mno-sse4.2 -mno-avx -mno-avx2
            -stdlib=libc++
          LDFLAGS: -stdlib=libc++
        run: |
          meson setup build \
            --buildtype=release \
            --prefix=/opt/retromesa \
            --libdir=lib64 \
            -Dgallium-drivers=i915,softpipe \
            -Dvulkan-drivers= \
            -Dllvm=disabled \
            -Degl=enabled \
            -Dgbm=enabled \
            -Dgles1=disabled \
            -Dgles2=enabled \
            -Dglx=disabled \
            -Dplatforms=

      - name: Build
        working-directory: mesa
        run: ninja -C build -j2

      - name: Install
        working-directory: mesa
        run: DESTDIR="$GITHUB_WORKSPACE/stage" ninja -C build install

      - name: Create DRI megadriver aliases
        run: |
          set -eux
          ROOT=stage/opt/retromesa/lib64
          test -f "$ROOT/libgallium-24.2.3.so"
          mkdir -p "$ROOT/dri"

          # Mesa's Gallium DRI target is one megadriver.  The loader selects
          # the entry point from the filename; ChromeOS' stripped install does
          # not create these aliases for us in this GitHub build.
          ln -sfn ../libgallium-24.2.3.so "$ROOT/dri/i915_dri.so"
          ln -sfn ../libgallium-24.2.3.so "$ROOT/dri/swrast_dri.so"
          ln -sfn ../libgallium-24.2.3.so "$ROOT/dri/kms_swrast_dri.so"
          ln -sfn libgallium-24.2.3.so "$ROOT/libgallium_dri.so"

          echo "=== driver entry points ==="
          nm -D "$ROOT/libgallium-24.2.3.so" | \
            grep -E '__driDriverGetExtensions_(i915|swrast|kms_swrast)$'

          echo "=== aliases ==="
          ls -lah "$ROOT"/libgallium* "$ROOT/dri"

          echo "=== software backend ==="
          strings "$ROOT/libgallium-24.2.3.so" | grep -Ei 'SOFTPIPE_DEBUG|__driDriverGetExtensions_swrast' | head -n 20

      - name: Verify package
        run: |
          set -eux
          ROOT=stage/opt/retromesa/lib64
          test -L "$ROOT/dri/i915_dri.so"
          test -L "$ROOT/dri/swrast_dri.so"
          test -L "$ROOT/dri/kms_swrast_dri.so"
          test -L "$ROOT/libgallium_dri.so"
          test -f "$ROOT/libEGL.so.1.0.0"
          test -f "$ROOT/libGLESv2.so.2.0.0"
          strings "$ROOT/libgallium-24.2.3.so" | grep -q SOFTPIPE_DEBUG

      - name: Collect package
        run: |
          mkdir -p out
          cp -a stage/opt out/opt
          {
            echo "RetroMesa Pineview R149 + i915 + softpipe"
            echo "Mesa commit:"
            git -C mesa rev-parse HEAD
            echo
            echo "Files:"
            find out/opt/retromesa -maxdepth 4 \( -type f -o -type l \) -print | sort
            echo
            echo "Driver symbols:"
            nm -D out/opt/retromesa/lib64/libgallium-24.2.3.so | \
              grep '__driDriverGetExtensions_' || true
            echo
            echo "Hashes:"
            find out/opt/retromesa -type f -print0 | sort -z | xargs -0 sha256sum
          } > out/manifest.txt
          tar -C out -czf retromesa-r149-pineview-softpipe.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: retromesa-r149-pineview-softpipe
          path: retromesa-r149-pineview-softpipe.tar.gz
