name: Build RetroMesa Pineview

on:
  workflow_dispatch:
  push:
    branches:
      - retrobrunch
    paths:
      - ".github/workflows/build-retro-mesa.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            meson \
            ninja-build \
            pkg-config \
            python3 \
            python3-mako \
            clang \
            lld \
            libc++-dev \
            libc++abi-dev \
            libdrm-dev \
            libexpat1-dev \
            libzstd-dev \
            zlib1g-dev \
            libpciaccess-dev \
            bison \
            flex

      - name: Clone exact ChromeOS Mesa
        run: |
          git clone https://chromium.googlesource.com/chromiumos/third_party/mesa mesa
          cd mesa
          git checkout 7e19431c4486b880d8f9b8681d50222ba44d651e
          git rev-parse HEAD
          git log -1 --oneline

      - name: Configure Pineview Mesa with software fallback
        working-directory: mesa
        env:
          CC: clang
          CXX: clang++
          CFLAGS: >-
            -O2
            -march=x86-64
            -mtune=generic
            -mno-sse4.1
            -mno-sse4.2
            -mno-avx
            -mno-avx2
          CXXFLAGS: >-
            -O2
            -march=x86-64
            -mtune=generic
            -mno-sse4.1
            -mno-sse4.2
            -mno-avx
            -mno-avx2
            -stdlib=libc++
          LDFLAGS: -stdlib=libc++
        run: |
          meson setup build \
            --buildtype=release \
            --prefix=/opt/retromesa \
            --libdir=lib64 \
            -Dgallium-drivers=i915,swrast \
            -Dvulkan-drivers= \
            -Dllvm=disabled \
            -Degl=enabled \
            -Dgbm=enabled \
            -Dgles1=disabled \
            -Dgles2=enabled \
            -Dglx=disabled \
            -Dplatforms=

      - name: Build
        working-directory: mesa
        run: ninja -C build -j2

      - name: Install
        working-directory: mesa
        run: DESTDIR="$GITHUB_WORKSPACE/stage" ninja -C build install

      - name: Verify i915 and swrast were built
        run: |
          echo "=== Installed RetroMesa tree ==="
          find stage/opt/retromesa -maxdepth 4 -type f -o -type l | sort
          echo
          echo "=== DRI drivers ==="
          find stage/opt/retromesa -path '*/dri/*' -maxdepth 5 -ls || true
          echo
          echo "=== Gallium software strings ==="
          find stage/opt/retromesa -type f \( -name 'libgallium*.so*' -o -name 'swrast_dri.so' \) -print0 | \
            xargs -0 -r strings | grep -Ei 'softpipe|swrast|i915' | sort -u | head -n 100 || true
          echo
          test -e stage/opt/retromesa/lib64/dri/i915_dri.so
          test -e stage/opt/retromesa/lib64/dri/swrast_dri.so

      - name: Collect package
        run: |
          mkdir -p out
          cp -a stage/opt out/opt
          {
            echo "RetroMesa Pineview R149 + swrast/softpipe fallback"
            echo "Mesa commit:"
            git -C mesa rev-parse HEAD
            echo
            echo "DRI drivers:"
            find out/opt/retromesa/lib64/dri -maxdepth 1 -type f -o -type l | sort
            echo
            echo "Driver symbols:"
            find out/opt/retromesa -type f -name '*.so*' -print0 | \
              xargs -0 -r nm -D 2>/dev/null | grep '__driDriverGetExtensions_' || true
            echo
            echo "Dependencies:"
            find out/opt/retromesa -type f -name '*.so*' -print0 | \
              xargs -0 -r readelf -d 2>/dev/null | grep -E 'NEEDED|SONAME' || true
            echo
            echo "Softpipe/swrast strings:"
            find out/opt/retromesa -type f \( -name 'libgallium*.so*' -o -name 'swrast_dri.so' \) -print0 | \
              xargs -0 -r strings | grep -Ei 'softpipe|swrast' | sort -u | head -n 100 || true
            echo
            echo "Hashes:"
            find out/opt/retromesa -type f -print0 | sort -z | xargs -0 sha256sum
          } > out/manifest.txt
          tar -C out -czf retromesa-r149-pineview-swrast.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: retromesa-r149-pineview-swrast
          path: retromesa-r149-pineview-swrast.tar.gz
