UI menu.c32
PROMPT 0
TIMEOUT 50
DEFAULT retrobrunch

MENU TITLE RetroBrunch Legacy BIOS

LABEL retrobrunch
    MENU LABEL RetroBrunch - ChromeOS
    LINUX /kernel
    INITRD /intel-ucode.img,/initramfs.img
    APPEND boot=local noresume noswap loglevel=7 ignore_loglevel cros_secure cros_debug options=

LABEL retrobrunch-debug
    MENU LABEL RetroBrunch - Debug
    LINUX /kernel
    INITRD /intel-ucode.img,/initramfs.img
    APPEND boot=local noresume noswap loglevel=7 ignore_loglevel drm.debug=0x1e cros_secure cros_debug options=
